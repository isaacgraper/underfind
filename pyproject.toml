[tool.poetry]
name = "underfind"
version = "2.1.0"
description = "Automated Content Intelligence Engine: Viral Shorts discovery, YouTube Outlier detection, and AI video script modeling."

authors = ["Isaac Graper <isaackleimmanngraper@gmail.com>"]
readme = "README.md"
packages = [{include = "underfind"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.31.0"}
pydantic = "^2.9.0"
google-api-python-client = "^2.140.0"
youtube-transcript-api = "^0.6.2"
requests = "^2.32.0"
python-dotenv = "^1.0.1"
rich = ">=13.0.0"
tzdata = ">=2024.1"
yt-dlp = ">=2025.1.1"
faster-whisper = "^1.1.0"
pillow = ">=10.4.0"
imageio-ffmpeg = ">=0.5.1"
ctranslate2 = ">=4.4.0"
sentencepiece = ">=0.2.0"
piper-tts = ">=1.3.0"
httpx = ">=0.27.0"
pyyaml = ">=6.0"
edge-tts = {version = ">=7.0.0", optional = true}
anthropic = {version = ">=1.9.0", optional = true}
rapidocr-onnxruntime = "^1.3.0"
gallery-dl = ">=1.27.0"

[tool.poetry.extras]
# Online, opt-in only: edge-tts voices and the LLM gateway's paid Claude provider.
online = ["edge-tts"]
claude = ["anthropic"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = ">=0.27.0"
black = "^24.8.0"
ruff = "^0.6.0"

[tool.poetry.scripts]
underfind = "underfind.backend.cli:main"
underfind-api = "underfind.backend.main:start"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
