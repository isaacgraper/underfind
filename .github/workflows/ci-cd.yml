name: Underfind Dev CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic google-api-python-client youtube-transcript-api requests python-dotenv rich tzdata pytest httpx

      - name: Run Automated Pytest Suite
        run: |
          python -m pytest underfind/backend/tests -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: underfind/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: underfind/frontend
        run: npm ci

      - name: Compile Production Bundle
        working-directory: underfind/frontend
        run: npm run build
